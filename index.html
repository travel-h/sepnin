<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming soon</title>
  <meta name="description" content="Something new is on the way. Leave your email and we will tell you the moment it is live.">
  <meta name="theme-color" content="#1B2DCC">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Coming soon">
  <meta property="og:description" content="Something new is on the way. Leave your email and we will tell you the moment it is live.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%231B2DCC'/><circle cx='32' cy='32' r='12' fill='%23FFCF4A'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
  <style>
    :root {
      --field: #1B2DCC;
      --paper: #F8F6F0;
      --mist: rgba(248, 246, 240, 0.72);
      --ink: #0E1233;
      --sun: #FFCF4A;
      --sun-bright: #FFDC78;
      --pad: clamp(1.25rem, 4vw, 3.5rem);
      --radius: 14px;
      --font: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--field);
      color: var(--paper);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.5;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: var(--pad);
      row-gap: 3rem;
    }

    /* Everything sits on the bottom edge, like a poster */
    .stage { align-self: end; }

    .headline {
      margin: 0 0 1.5rem;
      font-size: clamp(3.25rem, 11vw, 10.5rem);
      font-weight: 540;
      font-stretch: 92%;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    .lede {
      margin: 0 0 2rem;
      max-width: 42ch;
      font-size: clamp(1.125rem, 1.1vw + 0.75rem, 1.375rem);
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
    .num { display: inline-block; }

    .notify {
      display: flex;
      gap: 0.625rem;
      max-width: 34rem;
      margin: 0 0 0.875rem;
    }
    .notify input {
      flex: 1 1 auto;
      min-width: 0;
      height: 3.5rem;
      padding: 0 1.125rem;
      border: 0;
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      font: inherit;
    }
    .notify input::placeholder { color: rgba(14, 18, 51, 0.5); }
    .notify input:focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 2px;
    }
    .notify button {
      flex: 0 0 auto;
      height: 3.5rem;
      padding: 0 1.5rem;
      border: 0;
      border-radius: var(--radius);
      background: var(--sun);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .notify button:hover { background: var(--sun-bright); }
    .notify button:active { transform: translateY(1px); }
    .notify button:focus-visible {
      outline: 3px solid var(--paper);
      outline-offset: 2px;
    }
    .notify button:disabled { opacity: 0.6; cursor: default; }

    .note {
      margin: 0;
      color: var(--mist);
      font-size: 0.9375rem;
    }
    .note.is-error { color: var(--paper); }
    .note a { color: var(--paper); text-decoration: underline; text-underline-offset: 0.2em; }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem 2rem;
      color: var(--mist);
      font-size: 0.9375rem;
    }
    .foot p { margin: 0; }
    .foot a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }
    .foot a:hover { color: var(--paper); }
    .foot a:focus-visible {
      outline: 3px solid var(--paper);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .page { row-gap: 2rem; }
      .notify { flex-direction: column; }
      .notify button { width: 100%; }
    }

    /* One entrance on load, then the numbers only move when they change */
    @media (prefers-reduced-motion: no-preference) {
      .stage { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .num.tick { animation: tick 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    @keyframes tick { from { opacity: 0; transform: translateY(0.3em); } }
  </style>
</head>
<body>
  <div class="page">
    <main class="stage">
      <h1 class="headline" id="headline">Coming soon.</h1>
      <p class="lede">
        <span id="when">Something new is on the way.</span>
        <span id="ask">Leave your email and we'll tell you the moment it's live.</span>
      </p>

      <form class="notify" id="notify" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
        <button type="submit">Notify me</button>
      </form>
      <p class="note" id="status" aria-live="polite">One email when it's live. Nothing else.</p>
    </main>

    <footer class="foot">
      <p>&copy; 2026</p>
      <a href="mailto:hello@example.com">Say hello</a>
    </footer>
  </div>

  <script>
    (function () {
      // Edit these three lines.
      var CONFIG = {
        launchDate: "2026-10-15T09:00:00+05:00", // ISO 8601 with timezone offset; leave empty to hide the countdown
        notifyEndpoint: "",                      // URL that accepts POST JSON {"email": "..."}; empty disables signups
        launchUrl: ""                            // linked after launch day
      };

      var headline = document.getElementById("headline");
      var when = document.getElementById("when");
      var ask = document.getElementById("ask");
      var form = document.getElementById("notify");
      var input = document.getElementById("email");
      var button = form.querySelector("button");
      var status = document.getElementById("status");
      var launch = CONFIG.launchDate ? new Date(CONFIG.launchDate) : null;
      var countdown, launchDay;
      var prev = {};
      var timer;

      function text(str) {
        return document.createTextNode(str);
      }

      function setStatus(str, isError) {
        status.textContent = str;
        status.classList.toggle("is-error", !!isError);
      }

      function buildWhen() {
        countdown = document.createElement("span");
        launchDay = document.createElement("time");
        var options = { weekday: "long", month: "long", day: "numeric" };
        if (launch.getFullYear() !== new Date().getFullYear()) options.year = "numeric";
        launchDay.textContent = new Intl.DateTimeFormat(undefined, options).format(launch);
        launchDay.setAttribute("datetime", launch.toISOString());
        when.replaceChildren(
          text("Something new goes live in "), countdown,
          text(". That's "), launchDay, text(".")
        );
      }

      function render() {
        var ms = launch.getTime() - Date.now();
        if (ms <= 0) { launched(); return; }

        var total = Math.floor(ms / 1000);
        if (total < 60) {
          countdown.textContent = "less than a minute";
        } else {
          var units = [
            ["day", Math.floor(total / 86400)],
            ["hour", Math.floor((total % 86400) / 3600)],
            ["minute", Math.floor((total % 3600) / 60)]
          ];
          var present = units.filter(function (u) { return u[1] > 0; });
          var frag = document.createDocumentFragment();
          present.forEach(function (u, i) {
            if (i > 0) frag.appendChild(text(i === present.length - 1 ? " and " : ", "));
            var span = document.createElement("span");
            var changed = prev[u[0]] !== undefined && prev[u[0]] !== u[1];
            span.className = changed ? "num tick" : "num";
            span.textContent = u[1];
            frag.appendChild(span);
            frag.appendChild(text(" " + u[0] + (u[1] === 1 ? "" : "s")));
          });
          countdown.replaceChildren(frag);
          units.forEach(function (u) { prev[u[0]] = u[1]; });
        }

        clearTimeout(timer);
        timer = setTimeout(render, (ms % 60000) + 250);
      }

      function launched() {
        clearTimeout(timer);
        headline.textContent = "It's live.";
        when.replaceChildren(text("It went live on "), launchDay, text("."));
        ask.remove();
        form.hidden = true;
        status.classList.remove("is-error");
        if (CONFIG.launchUrl) {
          var a = document.createElement("a");
          a.href = CONFIG.launchUrl;
          a.textContent = "Take a look";
          status.replaceChildren(a, text("."));
        } else {
          status.textContent = "Thanks for waiting.";
        }
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var email = input.value.trim();
        if (!email || !input.checkValidity()) {
          setStatus("Enter a valid email address.", true);
          input.focus();
          return;
        }
        if (!CONFIG.notifyEndpoint) {
          setStatus("Signups are not connected yet. Check back soon.", true);
          return;
        }
        button.disabled = true;
        setStatus("Adding you to the list.");
        fetch(CONFIG.notifyEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, page: location.href })
        }).then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          form.hidden = true;
          setStatus("You're on the list. We'll email you the moment it's live.");
        }).catch(function () {
          button.disabled = false;
          setStatus("Couldn't save your email. Try again in a moment.", true);
        });
      });

      if (!launch || isNaN(launch.getTime())) return;
      buildWhen();
      render();
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) render();
      });
    })();
  </script>
</body>
</html>
